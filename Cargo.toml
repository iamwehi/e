[package]
name = "e"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A minimal security-audit agent harness"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Line editing and history at the prompt.
rustyline = { version = "19", default-features = false }
# setsid/kill for process groups, termios save/restore, isatty.
libc = "0.2"
yaml-rust2 = { version = "0.13", default-features = false }

[profile.release]
strip = true
